{% extends "base.html" %}
{% block content %}

<div class="card">
  <h3>导出报销单</h3>
  <form method="POST" action="/export">
    <div class="form-row">
      <div class="form-group"><label>开始日期</label><input type="date" name="date_from" value="{{ filters.date_from }}"></div>
      <div class="form-group"><label>结束日期</label><input type="date" name="date_to" value="{{ filters.date_to }}"></div>
      <div class="form-group"><label>销售方</label><input type="text" name="seller" value="{{ filters.seller }}" placeholder="模糊搜索"></div>
      <div class="form-group"><label>购买方</label><input type="text" name="buyer" value="{{ filters.buyer }}" placeholder="模糊搜索"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>归属项目</label><input type="text" name="project" value="{{ filters.project }}"></div>
      <div class="form-group"><label>归属人</label><input type="text" name="person" value="{{ filters.person }}"></div>
      <div class="form-group">
        <label>导出格式</label>
        <select name="format" style="width: 180px;">
          <option value="both" {{ 'selected' if filters.format == 'both' else '' }}>Excel + PDF</option>
          <option value="excel" {{ 'selected' if filters.format == 'excel' else '' }}>仅 Excel</option>
          <option value="pdf" {{ 'selected' if filters.format == 'pdf' else '' }}>仅 PDF</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">开始导出</button>
  </form>
</div>

{% if download_links %}
<div class="card" style="background: #e8f5e9; border: 1px solid #c8e6c9;">
  <h3 style="color: #2e7d32;">导出完成</h3>
  {% if invoice_count is not none %}
  <div class="summary">共导出 {{ invoice_count }} 张发票，可报销合计 ¥{{ "%.2f" | format(total_amount) }}</div>
  {% endif %}
  <div class="btn-group" style="margin-top: 8px;">
    {% for dl in download_links %}
    <a href="/export/download/{{ dl.filename }}" class="btn btn-success">{{ dl.label }}</a>
    {% endfor %}
  </div>
</div>
{% endif %}

{% endblock %}
