{% extends "base.html" %}
{% block content %}

<div class="card">
  <h3>标签管理</h3>
  <p style="color: #78716c; margin-bottom: 16px;">创建和管理标签，用于对发票进行分类和快速筛选。</p>

  <!-- 添加标签 -->
  <form method="POST" action="/tags" class="form-inline" style="margin-bottom: 20px;">
    <div class="form-row">
      <div class="form-group" style="flex: 1;">
        <label>标签名称</label>
        <input type="text" name="name" placeholder="输入标签名称" required>
      </div>
      <div class="form-group" style="flex: 0 0 120px;">
        <label>颜色</label>
        <input type="color" name="color" value="#3b82f6" style="height: 38px; padding: 2px;">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-bottom: 0;">创建标签</button>
    </div>
  </form>
</div>

{% if tags %}
<div class="card" style="padding: 0; overflow: hidden;">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>标签名称</th>
          <th>颜色</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tags %}
        <tr>
          <td>
            <span class="tag-badge" style="background: {{ tag.color }}20; color: {{ tag.color }}; border: 1px solid {{ tag.color }}40;">
              <span class="tag-dot" style="background: {{ tag.color }};"></span>
              {{ tag.name }}
            </span>
          </td>
          <td><code>{{ tag.color }}</code></td>
          <td>{{ tag.created_at[:10] if tag.created_at else '-' }}</td>
          <td>
            <form method="POST" action="/tags/{{ tag.id }}/delete" style="display:inline;" onsubmit="return confirm('确认删除标签「{{ tag.name }}」？将会从所有发票中移除该标签。')">
              <button type="submit" class="btn btn-outline btn-sm">删除</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% else %}
<div class="card">
  <div class="empty-state">
    <p>暂无标签</p>
    <p style="margin-top: 8px; font-size: 13px; color: #78716c;">创建第一个标签来对发票进行分类管理</p>
  </div>
</div>
{% endif %}

{% endblock %}
